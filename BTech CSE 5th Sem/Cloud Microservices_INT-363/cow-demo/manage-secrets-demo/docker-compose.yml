services:

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./db_password.txt:/run/secrets/db_password:ro
    depends_on:
      - database

  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_DATABASE: securedb
    volumes:
      - ./db_password.txt:/run/secrets/db_password:ro